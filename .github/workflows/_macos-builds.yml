name: macOS builds

on:
  workflow_call:
    inputs:
      build-type:
        required: true
        type: string
      libiio-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'macOS-15-x64'
            runner: macos-15-large
          - name: 'macOS-14-x64'
            runner: macos-14-large
          - name: 'macOS-13-x64'
            runner: macos-13
          - name: 'macOS-13-arm64'
            runner: macos-13-xlarge
    env:
      PACKAGE_TO_INSTALL: 'build/*.pkg'
      GH_TOKEN: ${{ github.token }}
      PYTHON: ${{ github.workspace }}/.venv/bin/python
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install py11, create venv and install dependencies
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          uv python install 3.11
          uv venv --python 3.11 --seed
          uv pip install requests

      - name: Get libiio from Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          set -e
          curl -sSL https://raw.githubusercontent.com/analogdevicesinc/wiki-scripts/refs/heads/main/utils/cloudsmith_utils/cloudsmith_helper.py \
            -o /tmp/cloudsmith_helper.py
          mkdir -p build && cd build
          $PYTHON /tmp/cloudsmith_helper.py \
            --method get_artifacts_from_location \
            --repo external \
            --package_version "${{ inputs.libiio-version }}" \
            --package_name "${{ matrix.name }}.pkg"
          ls -la .

      - name: Install dependencies
        run: ./CI/travis/before_install_darwin

      - name: Build
        run: ./CI/travis/make_darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            build/*.pkg
            build_tar/*.pkg
          if-no-files-found: error
