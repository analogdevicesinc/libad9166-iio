name: macOS Builds

on:
  workflow_call:
    inputs:
      build-type:
        required: true
        type: string
      libiio-version:
        required: true
        type: string
    secrets:
      CLOUDSMITH_API_KEY:
        required: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact-name: macOS-15-arm64
          - os: macos-15-large
            artifact-name: macOS-15-x64
          - os: macos-26
            artifact-name: macOS-26-arm64
          - os: macos-26-large
            artifact-name: macOS-26-x64
          - os: xcode-27
            artifact-name: macOS-27-arm64
    name: ${{ matrix.artifact-name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ARTIFACTNAME: ${{ matrix.artifact-name }}
      CMAKE_BUILD_TYPE: ${{ inputs.build-type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Get libiio from Cloudsmith
        uses: ./.github/actions/get-libiio
        with:
          cloudsmith-api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          package-name: ${{ matrix.artifact-name }}.pkg
          package-version: ${{ inputs.libiio-version }}
          python: python3
      - name: Install dependencies
        run: |
          set -e

          # The libiio macOS artifact may arrive as a tarball wrapping the .pkg.
          ( shopt -s nullglob; cd build; for tar in *.tar; do tar xf "$tar"; done )

          # Keep this a plain assignment: a VAR=$(...) prefix would swallow ls's failure.
          pkg=$(ls build/*.pkg)
          PACKAGE_TO_INSTALL="$pkg" ./CI/travis/before_install_darwin
      - name: Build
        run: ./CI/travis/make_darwin
      - name: Collect PKG artifacts
        run: |
          mkdir -p artifact-staging
          find build -name "*9166*.pkg" -exec cp {} artifact-staging/ \;
      - name: Upload Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: artifact-staging/
          if-no-files-found: error
