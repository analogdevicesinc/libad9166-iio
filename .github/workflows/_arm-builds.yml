name: ARM builds

on:
  workflow_call:
    inputs:
      build-type:
        required: true
        type: string
      libiio-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  arm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Ubuntu-ppc64le'
            arch: ppc64le
            image: 'tfcollins/libiio_ubuntu_18_04-ci-arm-ppc:latest'
          - name: 'Ubuntu-x390x'
            arch: s390x
            image: 'tfcollins/libiio_ubuntu_18_04-ci-arm-ppc:latest'
          - name: 'Ubuntu-arm32v7'
            arch: arm
            image: 'tfcollins/libiio_ubuntu_18_04-ci-arm-ppc:latest'
          - name: 'Ubuntu-arm64v8'
            arch: aarch64
            image: 'tfcollins/libiio_ubuntu_18_04-ci-arm-ppc:latest'
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHON: ${{ github.workspace }}/.venv/bin/python
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install py11, create venv and install dependencies
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          uv python install 3.11
          uv venv --python 3.11 --seed
          uv pip install requests

      - name: Get libiio from Cloudsmith (best effort)
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          set -e
          wget https://raw.githubusercontent.com/analogdevicesinc/wiki-scripts/refs/heads/main/utils/cloudsmith_utils/cloudsmith_helper.py \
            -O /tmp/cloudsmith_helper.py
          mkdir -p build && cd build
          $PYTHON /tmp/cloudsmith_helper.py \
            --method get_artifacts_from_location \
            --repo external \
            --package_version "${{ inputs.libiio-version }}" \
            --package_name "${{ matrix.name }}.deb" \
            || echo "No libiio deb for ${{ matrix.name }} in ${{ inputs.libiio-version }}; ci-ubuntu.sh will install libiio from apt."
          ls -la . || true

      - name: Setup QEMU
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          sudo sysctl kernel.randomize_va_space=0
          sudo docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build
        run: |
          set -e
          sudo docker run --platform "linux/${{ matrix.arch }}" --rm -t --privileged \
            -e ARTIFACTNAME='${{ matrix.name }}' \
            -v "$PWD":"/ci" \
            -v "/usr/bin/qemu-${{ matrix.arch }}-static":"/usr/bin/qemu-${{ matrix.arch }}-static" \
            "${{ matrix.image }}" \
            /bin/bash -c "cd /ci/ && chmod +x ./CI/travis/ci-ubuntu.sh && ./CI/travis/ci-ubuntu.sh"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            build/*.deb
            build/*.rpm
          if-no-files-found: error
