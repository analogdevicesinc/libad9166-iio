name: Build and Deploy libad9166-iio

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - next_stable
      - 'staging/*'
      - '20*'
  pull_request:
    branches:
      - main
      - next_stable
      - '20*'
  schedule:
    - cron: '0 0 1 * *'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build-type: ${{ steps.set.outputs.build-type }}
      libiio-version: ${{ steps.set.outputs.libiio-version }}
      is-main: ${{ steps.set.outputs.is-main }}
      is-release: ${{ steps.set.outputs.is-release }}
      cloudsmith-version: ${{ steps.set.outputs.cloudsmith-version }}
    steps:
      - id: set
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "build-type=Release" >> "${GITHUB_OUTPUT}"
            echo "is-release=true" >> "${GITHUB_OUTPUT}"
            echo "cloudsmith-version=${GITHUB_REF#refs/tags/}" >> "${GITHUB_OUTPUT}"
            echo "libiio-version=libiio-main~latest" >> "${GITHUB_OUTPUT}"
          else
            echo "build-type=RelWithDebInfo" >> "${GITHUB_OUTPUT}"
            echo "is-release=false" >> "${GITHUB_OUTPUT}"
            echo "libiio-version=libiio-main~latest" >> "${GITHUB_OUTPUT}"
          fi
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "is-main=true" >> "${GITHUB_OUTPUT}"
            echo "cloudsmith-version=libad9166-iio-main~latest" >> "${GITHUB_OUTPUT}"
            echo "libiio-version=libiio-main~latest" >> "${GITHUB_OUTPUT}"
          elif [[ "${GITHUB_REF}" == refs/heads/staging/* ]]; then
            echo "is-main=false" >> "${GITHUB_OUTPUT}"
            echo "cloudsmith-version=test-main" >> "${GITHUB_OUTPUT}"
            echo "libiio-version=libiio-main~latest" >> "${GITHUB_OUTPUT}"
          else
            echo "is-main=false" >> "${GITHUB_OUTPUT}"
            echo "libiio-version=libiio-main~latest" >> "${GITHUB_OUTPUT}"
          fi

  linux:
    needs: setup
    uses: ./.github/workflows/_linux-builds.yml
    with:
      build-type: ${{ needs.setup.outputs.build-type }}
      libiio-version: ${{ needs.setup.outputs.libiio-version }}
    secrets: inherit

  arm:
    needs: setup
    uses: ./.github/workflows/_arm-builds.yml
    with:
      build-type: ${{ needs.setup.outputs.build-type }}
      libiio-version: ${{ needs.setup.outputs.libiio-version }}
    secrets: inherit

  macos:
    needs: setup
    uses: ./.github/workflows/_macos-builds.yml
    with:
      build-type: ${{ needs.setup.outputs.build-type }}
      libiio-version: ${{ needs.setup.outputs.libiio-version }}
    secrets: inherit

  windows:
    needs: setup
    uses: ./.github/workflows/_windows-builds.yml
    with:
      build-type: ${{ needs.setup.outputs.build-type }}
      libiio-version: ${{ needs.setup.outputs.libiio-version }}
    secrets: inherit
