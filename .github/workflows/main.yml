name: Build and Deploy libad9166-iio

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - next_stable
      - libad9166-iio-v0
      - 'staging/*'
      - '20*'
  pull_request:
    branches:
      - main
      - next_stable
      - libad9166-iio-v0
      - '20*'
  schedule:
    - cron: '0 0 1 * *'

env:
  LIBIIO_VERSION: ''

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build-type: ${{ steps.set.outputs.build-type }}
      libiio-version: ${{steps.set.outputs.libiio-version }}
      is-v0: ${{ steps.set.outputs.is-v0 }}
      is-release: ${{ steps.set.outputs.is-release }}
      cloudsmith-version: ${{ steps.set.outputs.cloudsmith-version }}
    steps:
      - id: set
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "build-type=Release" >> "${GITHUB_OUTPUT}"
            echo "is-release=true" >> "${GITHUB_OUTPUT}"
            echo "cloudsmith-version=${GITHUB_REF#refs/tags/}" >> "${GITHUB_OUTPUT}"
            echo "libiio-version=libiio-v0~latest" >> "${GITHUB_OUTPUT}"
          else
            echo "build-type=RelWithDebInfo" >> "${GITHUB_OUTPUT}"
            echo "is-release=false" >> "${GITHUB_OUTPUT}"
            echo "libiio-version=libiio-v0~latest" >> "${GITHUB_OUTPUT}"
          fi
          if [[ "${GITHUB_REF}" == "refs/heads/libad9166-iio-v0" ]]; then
            echo "is-v0=true" >> "${GITHUB_OUTPUT}"
            echo "cloudsmith-version=libad9166-iio-v0~latest" >> "${GITHUB_OUTPUT}"
            echo "libiio-version=libiio-v0~latest" >> "${GITHUB_OUTPUT}"
          elif [[ "${GITHUB_REF}" == refs/heads/staging/* ]]; then
            echo "is-v0=false" >> "${GITHUB_OUTPUT}"
            echo "cloudsmith-version=test-v0" >> "${GITHUB_OUTPUT}"
            echo "libiio-version=libiio-v0~latest" >> "${GITHUB_OUTPUT}"
          else
            echo "is-v0=false" >> "${GITHUB_OUTPUT}"
            echo "libiio-version=libiio-v0~latest" >> "${GITHUB_OUTPUT}"
          fi

  linux:
    needs: setup
    uses: ./.github/workflows/_linux-builds.yml
    with:
      build_ref: ${{ needs.setup.outputs.build_ref }}
      libiio_version: ${{ needs.setup.outputs.libiio_version }}
      is_main: ${{ needs.setup.outputs.is_main == 'true' }}
      is_release_tag: ${{ needs.setup.outputs.is_release_tag == 'true' }}
    secrets: inherit

  arm:
    needs: setup
    uses: ./.github/workflows/_arm-builds.yml
    with:
      build_ref: ${{ needs.setup.outputs.build_ref }}
      libiio_version: ${{ needs.setup.outputs.libiio_version }}
    secrets: inherit

  macos:
    needs: setup
    uses: ./.github/workflows/_macos-builds.yml
    with:
      build_ref: ${{ needs.setup.outputs.build_ref }}
      libiio_version: ${{ needs.setup.outputs.libiio_version }}
    secrets: inherit

  windows:
    needs: setup
    uses: ./.github/workflows/_windows-builds.yml
    with:
      build_ref: ${{ needs.setup.outputs.build_ref }}
      libiio_version: ${{ needs.setup.outputs.libiio_version }}
    secrets: inherit

  deploy:
    needs: [setup, linux, arm, macos, windows]
    if: ${{ needs.setup.outputs.do_deploy == 'true' }}
    runs-on: ubuntu-latest
    env:
      BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}/artifacts
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}

      - name: Prepare artifacts for SWDownloads
        run: ./CI/azure/prepare_assets.sh swdownloads "${{ needs.setup.outputs.source_branch_name }}"

      - name: Push artifacts to SW Downloads
        env:
          SERVER_ADDRESS: ${{ secrets.SWDOWNLOADS_SERVER_ADDRESS }}
          SWDOWNLOADS_KEY: ${{ secrets.SWDOWNLOADS_KEY }}
        run: |
          echo "$SWDOWNLOADS_KEY" > id_rsa
          chmod 600 id_rsa
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=+ssh-dss -i id_rsa \
            -r "$BUILD_ARTIFACTSTAGINGDIRECTORY"/* "$SERVER_ADDRESS"
