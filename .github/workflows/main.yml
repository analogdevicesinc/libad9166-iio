name: Build libad9166 across multiple os and arhitectures
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - next_stable
      - libad9166-iio-v0
      - staging/*
      - 20*
    tags:
      - v*
  pull_request:
    branches:
      - main
      - next_stable
      - libad9166-iio-v0
      - staging/*
      - 20*
  schedule:
  - cron: '0 0 1 * *'


jobs:
  scheduled-dispatch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run main.yml --ref libad9166-iio-v0 main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  setup:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      build-type: ${{ steps.set.outputs.build-type }}
      is-v0: ${{ steps.set.outputs.is-v0 }}
      is-release: ${{ steps.set.outputs.is-release }}
      cloudsmith-version: ${{ steps.set.outputs.cloudsmith-version }}
    steps:
      - id: set
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "build-type=Release" >> "${GITHUB_OUTPUT}"
            echo "is-release=true" >> "${GITHUB_OUTPUT}"
            echo "cloudsmith-version=${GITHUB_REF#refs/tags/}" >> "${GITHUB_OUTPUT}"
          else
            echo "build-type=RelWithDebInfo" >> "${GITHUB_OUTPUT}"
            echo "is-release=false" >> "${GITHUB_OUTPUT}"
          fi
          if [[ "${GITHUB_REF}" == "refs/heads/libad9166-iio-v0" ]]; then
            echo "is-v0=true" >> "${GITHUB_OUTPUT}"
            echo "cloudsmith-version=libad9166-iio-v0~latest" >> "${GITHUB_OUTPUT}"
          elif [[ "${GITHUB_REF}" == refs/heads/staging/* ]]; then
            echo "is-v0=false" >> "${GITHUB_OUTPUT}"
            echo "cloudsmith-version=test-v0" >> "${GITHUB_OUTPUT}"
          else
            echo "is-v0=false" >> "${GITHUB_OUTPUT}"
          fi


  ############################################
  # BUILDS
  ############################################
  linux:
    needs: setup
    uses: ./.github/workflows/_linux_builds.yml
    with:
      build-type: RelWithDebInfo
      package_version: ${{ needs.setup.outputs.download_branch }}
    secrets: inherit
  arm:
    needs: setup
    uses: ./.github/workflows/_arm_builds.yml
    with:
      build-type: RelWithDebInfo
      package_version: ${{ needs.setup.outputs.download_branch }}
    secrets: inherit
  macos:
    needs: setup
    uses: ./.github/workflows/_macOS_builds.yml
    with:
      build-type: RelWithDebInfo
      package_version: ${{ needs.setup.outputs.download_branch }}
    secrets: inherit
  windows:
    needs: setup
    uses: ./.github/workflows/_windows_builds.yml
    with:
      build-type: RelWithDebInfo
      package_version: ${{ needs.setup.outputs.download_branch }}
    secrets: inherit

  build_with_libiio0:
    needs: setup
    uses: ./.github/workflows/build.yaml
    secrets: inherit

  #############################################
  # Python sdist/wheel
  #############################################
  # build-pypi:
  #   # if: needs.setup.outputs.is-v0 == 'true' || needs.setup.outputs.is-release == 'true'
  #   needs: [setup]
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 10
  #   steps:
  #     - uses: actions/checkout@v7
  #       with:
  #         fetch-depth: 1
  #     - uses: analogdevicesinc/shared-actions/pypi-build@pypi-build
  #       with:
  #         cmake-options: '-DPYTHON_BINDINGS=ON -DENABLE_PACKAGING=ON -DDEB_DETECT_DEPENDENCIES=ON'
  #         apt-packages: 'cmake libiio-dev'
  #         artifact-name: pylibad9166-dist

 #############################################
  # Check Artifacts
  #############################################
  check-artifacts:
    # Build jobs only upload artifacts on non-PR events, so only check then. 
    if: github.event_name != 'pull_request'
    needs: [setup, linux, arm, macos, windows, build_with_libiio0]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          path: artifacts/

      - name: Check artifacts
        run: |
          set -e
          MISSING=0
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            count=$(find "$dir" -type f | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "EMPTY: $name"
              MISSING=$((MISSING + 1))
            else
              echo "OK: $name ($count file(s))"
            fi
          done
          echo ""
          find artifacts -type f | sort | tee artifact_manifest.txt
          echo ""
          echo "Total: $(wc -l < artifact_manifest.txt) files"
          if [ "$MISSING" -gt 0 ]; then
            echo "ERROR: $MISSING artifact(s) empty"
            exit 1
          fi

      - name: Upload manifest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: Artifact-manifest
          path: artifact_manifest.txt

  #############################################
  # Push to Cloudsmith
  #############################################
  push-cloudsmith:
    # if: needs.setup.outputs.is_v0 == 'true' || needs.setup.outputs.is_release == 'true'
    needs: [setup, check-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          path: ${{ github.workspace }}/artifacts

      - name: Install Cloudsmith CLI
        run: pip install cloudsmith-cli

      - name: Upload to Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.TEST_REPO_CLOUDSMITH_TOKEN }}
        run: |
          set -e
          VERSION="${{ needs.setup.outputs.cloudsmith-version }}"
          ARTIFACTS="${{ github.workspace }}/artifacts"
          for dir in "${ARTIFACTS}"/*/; do
            tag=$(basename "${dir}")
            [[ "${tag}" == "Artifact manifest" ]] && continue
            if [[ "${tag}" == Windows-* ]]; then
              cd "${ARTIFACTS}"
              zip -r "${tag}.zip" "${tag}"
              rm -r "${tag}"
              cloudsmith push raw --republish \
                --tags "${tag}" \
                --version "${VERSION}" \
                adi/test-alin-repo "${tag}.zip"
              rm "${tag}.zip"
              cd -
              continue
            fi
            for file in "${dir}"*; do
              [[ -f "${file}" ]] || continue
              filename=$(basename "${file}")
              # Strip git hash (.g<hex>) so the name is stable across commits
              stable=$(echo "${filename}" | sed -e 's/\.g[0-9a-f]{7,12\}//')
              ext="${stable##*.}"
              stable="${stable%.${ext}}"
              # macOS .pkg files don't include arch in the name; add tag
              if [[ "${filename}" != *"${tag}"* ]]; then
                stable="${stable}-${tag}"
              fi
              cloudsmith push raw --republish \
                --name "${stable}.${ext}" \
                --tags "${tag}" \
                --version "${VERSION}" \
                adi/test-alin-repo "${file}"
            done
          done

  #############################################
  # Push to GitHub Release
  #############################################
  push-github-release:
     if: needs.setup.outputs.is-release == 'true'
     needs: [setup, check-artifacts]
     runs-on: ubuntu-latest
     timeout-minutes: 10
     steps:
       - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
         with:
          fetch-depth: 1

       - name: Download all artifacts
         uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
         with:
           path: ${{ github.workspace }}/artifacts

       - name: Prepare assets for release
         run: ./CI/azure/prepare_assets.sh release
         env:
           BUILD_SOURCESDIRECTORY: ${{ github.workspace }}
           BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}/artifacts

       - name: Create GitHub Release
         uses: softprops/action-gh-release@a6c7483a42ee9d5daced968f6c217562cd680f7f
         with:
           draft: true
           name: "libad9166 release ${{ github.ref_name }}"
           files: ${{ github.workspace }}/artifacts/*
           generate_release_notes: true
