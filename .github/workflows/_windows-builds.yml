name: Windows builds

# Reusable workflow. Port of azure-pipelines.yml jobs "WindowsBuilds" and
# "GenerateSetupExe". The PowerShell scripts under CI/ are invoked
# unchanged; BUILD_ARTIFACTSTAGINGDIRECTORY (an Azure variable the scripts
# rely on) is exported to a real path here.

on:
  workflow_call:
    inputs:
      build_ref:
        required: true
        type: string
      libiio_version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows_build:
    runs-on: windows-2022
    env:
      COMPILER: 'Visual Studio 17 2022'
      ARCH: 'x64'
      BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}\artifacts
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.build_ref }}
          fetch-depth: 1

      - name: Create artifact staging directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY | Out-Null

      - name: Download and stage libiio (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          # Replaces the Azure cross-pipeline download. build_win.ps1 expects
          # libiio.lib and iio.h in the build/ directory, and the packaging
          # steps expect libiio.dll in build/.
          gh release download "${{ inputs.libiio_version }}" --repo analogdevicesinc/libiio --pattern "Windows.zip" --dir libiio_pkg
          Expand-Archive -Force libiio_pkg\Windows.zip -DestinationPath libiio_pkg\extracted
          Get-ChildItem -Recurse libiio_pkg\extracted -Include libiio.lib,iio.h,libiio.dll |
            ForEach-Object { Copy-Item $_.FullName build\ -Force }
          Get-ChildItem build\

      - name: Dependencies
        shell: pwsh
        run: .\CI\install_deps_win.ps1

      - name: Build
        shell: pwsh
        run: .\CI\build_win.ps1

      - name: Copy libraries
        shell: pwsh
        run: |
          if (Test-Path build\Release) {
            Copy-Item build\Release\* $env:BUILD_ARTIFACTSTAGINGDIRECTORY -Recurse -Force
          }

      - name: Copy ad9166.h header
        shell: pwsh
        run: |
          if (Test-Path ad9166.h) { Copy-Item ad9166.h $env:BUILD_ARTIFACTSTAGINGDIRECTORY -Force }

      - name: Copy .exe files
        shell: pwsh
        run: |
          Get-ChildItem build\*.exe -ErrorAction SilentlyContinue |
            Copy-Item -Destination $env:BUILD_ARTIFACTSTAGINGDIRECTORY -Force

      - name: Copy libiio.dll
        shell: pwsh
        run: |
          if (Test-Path build\libiio.dll) { Copy-Item build\libiio.dll $env:BUILD_ARTIFACTSTAGINGDIRECTORY -Force }

      - name: Copy dependencies
        shell: pwsh
        run: .\CI\publish_deps.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Windows-VS-2022-x64
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}
          if-no-files-found: error

  generate_setup_exe:
    needs: windows_build
    runs-on: windows-2019
    env:
      BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}\artifacts
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.build_ref }}
          fetch-depth: 1

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}

      - name: List staged artifacts
        shell: bash
        run: ls -al "$BUILD_ARTIFACTSTAGINGDIRECTORY"

      - name: Generate libad9166-setup.exe
        shell: pwsh
        run: .\CI\generate_exe.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Libad9166-Setup-Exe
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}
          if-no-files-found: error
