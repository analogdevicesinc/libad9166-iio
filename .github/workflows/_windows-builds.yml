name: Windows Builds

on:
  workflow_call:
    inputs:
      build-type:
        required: true
        type: string
      libiio-version:
        required: true
        type: string

jobs:
  msvc:
    name: ${{ matrix.artifact-name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: Visual Studio 17 2022
            vmImage: windows-2022
            arch: x64
            artifact-name: Windows-VS-2022-x64

    runs-on: ${{ matrix.vmImage }}
    timeout-minutes: 15
    env:
      COMPILER: ${{ matrix.compiler }}
      ARCH: ${{ matrix.arch }}
      USE_CSHARP: 'ON'
      BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}\staging
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install requests sphinx
      - name: Get libiio from Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/analogdevicesinc/wiki-scripts/refs/heads/main/utils/cloudsmith_utils/cloudsmith_helper.py" `
            -OutFile "$env:TEMP\cloudsmith_helper.py"
          if (!(Test-Path build)) { mkdir build }
          cd build
          python "$env:TEMP\cloudsmith_helper.py" `
            --method get_artifacts_from_location `
            --repo external `
            --package_version "${{inputs.libiio-version}}" `
            --package_name "${{ matrix.artifact-name }}.zip"
          # libiio v1 nests the binaries under a build-type directory and ships
          # its headers as an iio/ tree. build_win.ps1 wants libiio1.lib next to
          # the include root, so flatten the binaries but keep iio/ intact.
          7z x "${{ matrix.artifact-name }}.zip" -o"libiio_pkg" -y
          Get-ChildItem -Recurse libiio_pkg -Include *.dll,*.lib |
            ForEach-Object { Copy-Item $_.FullName . -Force }
          $inc = Get-ChildItem -Recurse -Directory libiio_pkg -Filter iio | Select-Object -First 1
          Copy-Item $inc.FullName .\iio -Recurse -Force
          Get-ChildItem .
      - name: Create staging directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:BUILD_ARTIFACTSTAGINGDIRECTORY"

      - name: Build
        shell: pwsh
        run: .\CI\build_win.ps1

      - name: Copy libraries
        shell: pwsh
        run: |
          Copy-Item -Path "build\Release\*" -Destination "$env:BUILD_ARTIFACTSTAGINGDIRECTORY" -Force

      - name: Copy ad9166.h header
        shell: pwsh
        run: |
          Copy-Item -Path "ad9166.h" -Destination "$env:BUILD_ARTIFACTSTAGINGDIRECTORY"

      - name: Copy .exe files
        shell: pwsh
        run: |
          Copy-Item -Path "build\*.exe" -Destination "$env:BUILD_ARTIFACTSTAGINGDIRECTORY" -ErrorAction SilentlyContinue

      - name: Copy libiio1.dll
        shell: pwsh
        run: |
          Copy-Item -Path "build\libiio1.dll" -Destination "$env:BUILD_ARTIFACTSTAGINGDIRECTORY"

      - name: Copy dependencies
        shell: pwsh
        run: .\CI\publish_deps.ps1

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ github.workspace }}\staging

  generate-setup-exe:
    name: Generate Setup Exe
    needs: msvc
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    env:
      BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}\staging

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download Windows build artifacts
        uses: actions/download-artifact@v8
        with:
          name: Windows-VS-2022-x64
          path: ${{ github.workspace }}\staging\Windows-VS-2022-x64

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Generate libad9166-setup.exe
        shell: pwsh
        run: .\CI\generate_exe.ps1

      - name: Upload setup exe
        uses: actions/upload-artifact@v7
        with:
          name: Libad9166-Setup-Exe
          path: ${{ github.workspace }}\staging
