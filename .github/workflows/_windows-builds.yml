name: Windows Builds

on:
  workflow_call:
    inputs:
      build-type:
        required: true
        type: string
      libiio-version:
        required: true
        type: string
    secrets:
      CLOUDSMITH_API_KEY:
        required: true

jobs:
  msvc:
    name: ${{ matrix.artifact-name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: Visual Studio 17 2022
            vmImage: windows-2022
            arch: x64
            artifact-name: Windows-VS-2022-x64

    runs-on: ${{ matrix.vmImage }}
    timeout-minutes: 15
    env:
      COMPILER: ${{ matrix.compiler }}
      ARCH: ${{ matrix.arch }}
      USE_CSHARP: 'ON'
      CMAKE_BUILD_TYPE: ${{ inputs.build-type }}
      BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}\staging
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Get libiio from Cloudsmith
        uses: ./.github/actions/get-libiio
        with:
          cloudsmith-api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          package-name: ${{ matrix.artifact-name }}.zip
          package-version: ${{ inputs.libiio-version }}
          # setup-python does not provide a python3 shim on Windows
          python: python
      - name: Stage libiio for the build
        shell: pwsh
        working-directory: build
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = "$env:RUNNER_TEMP\libiio_pkg"
          7z x "${{ matrix.artifact-name }}.zip" -o"$pkg" -y
          # Deps sit at the package root, libiio1.dll/.lib under <build-type>/, and a
          # duplicate set under Debug/ on non-release builds. Take everything but Debug.
          Get-ChildItem -Recurse $pkg -Include *.dll,*.lib |
            Where-Object { $_.Directory.Name -ne 'Debug' } |
            ForEach-Object { Copy-Item $_.FullName . -Force }
          $inc = Get-ChildItem -Recurse -Directory $pkg -Filter iio | Select-Object -First 1
          Copy-Item $inc.FullName .\iio -Recurse -Force
      - name: List libiio artifact contents (verify deps present)
        shell: pwsh
        run: Get-ChildItem build\*.dll
      - name: Create staging directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:BUILD_ARTIFACTSTAGINGDIRECTORY"

      - name: Build
        shell: pwsh
        run: .\CI\build_win.ps1

      - name: Copy libraries
        shell: pwsh
        run: |
          Copy-Item -Path "build\$env:CMAKE_BUILD_TYPE\*" -Destination "$env:BUILD_ARTIFACTSTAGINGDIRECTORY" -Force

      - name: Copy ad9166.h header
        shell: pwsh
        run: |
          Copy-Item -Path "ad9166.h" -Destination "$env:BUILD_ARTIFACTSTAGINGDIRECTORY"

      - name: Copy .exe files
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Recurse -Filter *.exe |
            Where-Object { $_.Directory.Name -eq $env:CMAKE_BUILD_TYPE } |
            Copy-Item -Destination "$env:BUILD_ARTIFACTSTAGINGDIRECTORY"

      - name: Copy libiio1.dll
        shell: pwsh
        run: |
          Copy-Item -Path "build\libiio1.dll" -Destination "$env:BUILD_ARTIFACTSTAGINGDIRECTORY"

      - name: Copy dependencies
        shell: pwsh
        run: .\CI\publish_deps.ps1

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ github.workspace }}\staging
          if-no-files-found: error

  generate-setup-exe:
    name: Generate Setup Exe
    needs: msvc
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}\staging

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Download Windows build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Windows-VS-2022-x64
          path: ${{ github.workspace }}\staging\Windows-VS-2022-x64

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Generate libad9166-setup.exe
        shell: pwsh
        run: .\CI\generate_exe.ps1

      - name: Upload setup exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Libad9166-Setup-Exe
          path: ${{ github.workspace }}\staging
          if-no-files-found: error
