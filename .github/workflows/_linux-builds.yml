name: Linux builds

on:
  workflow_call:
    inputs:
      build-type:
        required: true
        type: string
      libiio-version:
        required: true
        type: string
jobs:
  linux:
    name: ${{ matrix.artifact-name }}                   
    runs-on: ubuntu-latest
    env:
      PYTHON: ${{ github.workspace }}/.venv/bin/python3
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            artifact-name: Linux-Ubuntu-22.04
            build-script: ci-linux.sh
            os-type: default
            package-type: deb
          - image: ubuntu:24.04
            artifact-name: Linux-Ubuntu-24.04
            build-script: ci-linux.sh
            os-type: default
            package-type: deb
          - image: ubuntu:26.04
            artifact-name: Linux-Ubuntu-26.04
            build-script: ci-linux.sh
            os-type: default
            package-type: deb
          - image: debian:bookworm
            artifact-name: Linux-Debian-12
            build-script: ci-linux.sh
            os-type: default
            package-type: deb
          - image: debian:trixie
            artifact-name: Linux-Debian-13
            build-script: ci-linux.sh
            os-type: default
            package-type: deb
          - image: fedora:42
            artifact-name:  Linux-Fedora-42
            build-script: ci-linux.sh
            os-type: fedora
            package-type: rpm

          - image: fedora:44
            artifact-name:  Linux-Fedora-44
            build-script: ci-linux.sh
            os-type: fedora
            package-type: rpm
          - image: opensuse/leap:15.6
            artifact-name: Linux-openSUSE-15.6
            build-script: ci-linux.sh
            os-type: opensuse
            package-type: rpm

          - image: opensuse/leap:16.0
            artifact-name: Linux-openSUSE-16.0
            build-script: ci-linux.sh
            os-type: opensuse
            package-type: rpm
    defaults:
      run:
        shell: /bin/bash {0}
    container:
      image: ${{ matrix.image }}
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Install dependencies
        run: |
          set -e

          # Ubuntu / Debian
          if command -v apt-get &>/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y build-essential git cmake libxml2-dev bison flex \
              libcdk5-dev libaio-dev libusb-1.0-0-dev \
              libserialport-dev libavahi-client-dev doxygen graphviz man2html \
              python3 python3-pip python3-setuptools curl wget sudo tar
            pip3 install sphinx --break-system-packages 2>/dev/null || pip3 install sphinx

          # Fedora
          elif command -v dnf &>/dev/null; then
            dnf install -y cmake gcc gcc-c++ git flex bison libxml2-devel \
              libaio-devel libusb1-devel avahi-devel \
              libserialport-devel rpm-build doxygen graphviz \
              python3-pip python3-setuptools curl wget sudo tar
            pip3 install sphinx --break-system-packages 2>/dev/null || pip3 install sphinx

          # openSUSE
          elif command -v zypper &>/dev/null; then           
            zypper --gpg-auto-import-keys ref
            zypper in -y --allow-downgrade gcc-c++ make cmake git libxml2-devel bison flex cdk-devel \
              libaio-devel libusb-1_0-devel \
              libserialport-devel libavahi-devel avahi rpm-build doxygen graphviz \
              python3 python3-pip python3-setuptools sudo wget curl tar
            pip3 install sphinx --break-system-packages 2>/dev/null || pip3 install sphinx
          fi
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Install py11, create venv and install dependencies
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          uv python install 3.11
          uv venv --python 3.11 --seed
          uv pip install requests

      - name: Get libiio from Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          set -e
          wget https://raw.githubusercontent.com/analogdevicesinc/wiki-scripts/refs/heads/main/utils/cloudsmith_utils/cloudsmith_helper.py \
            -O /tmp/cloudsmith_helper.py
          mkdir -p build && cd build
          $PYTHON /tmp/cloudsmith_helper.py \
            --method get_artifacts_from_location \
            --repo external \
            --package_version "${{ inputs.libiio-version }}" \
            --package_name "${{ matrix.name }}.${{ matrix.ext }}"

      - name: Build
        run: |
          set -e
          sudo docker run --rm -t --privileged \
            -e ARTIFACTNAME='${{ matrix.name }}' \
            -v "$PWD":"/ci" "${{ matrix.image }}" \
            /bin/bash -c "cd /ci/ && chmod +x ./CI/travis/ci-linux.sh && ./CI/travis/ci-linux.sh ${{ matrix.os-type }} /ci/build/*.${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            build/*.deb
            build/*.rpm
          if-no-files-found: error

      - name: Install wheel and twine
        if: matrix.name == 'Linux-Ubuntu-20.04'
        run: |
          sudo pip install setuptools wheel twine build
          cd build/bindings/python
          sudo python setup.py bdist_wheel

      - name: Deploy python package (PyPI, on tag)
        if: ${{ matrix.name == 'Linux-Ubuntu-20.04' && inputs.is_release_tag }}
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          cd build/bindings/python
          python -m twine upload dist/*.whl

      - name: Update to dev version and deploy (Test PyPI, on main)
        if: ${{ matrix.name == 'Linux-Ubuntu-20.04' && inputs.is_main }}
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          cd build/bindings/python
          sudo rm -f ./dist/*.whl
          sudo pip3 install --upgrade requests
          sudo pip install invoke
          sudo invoke bumpversion-test
          sudo python -m build
          ls -al
          python -m twine upload --repository-url https://test.pypi.org/legacy/ --skip-existing dist/*.whl
